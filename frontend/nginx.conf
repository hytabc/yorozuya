map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 默认只允许较小的请求体；只有下面的上传入口才放宽到 55m，
    # 避免任意路径都被大 body 反复洪泛（nginx 缓冲会占用内存）。
    client_max_body_size 1m;

    # 生产环境本容器只被 edge 反向代理访问（无宿主机端口），$remote_addr 会是 edge 的容器 IP。
    # 这里信任私网来源并用 edge 写入的 X-Real-IP 还原真实客户端 IP，
    # 否则下方 proxy_set_header 透传给后端的会是同一个 IP，导致登录等限流把所有人算作同一来源。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # 通用安全响应头（未自行 add_header 的 location 会继承这些设置）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # 注意：nginx 的 add_header 不会跨层级合并 —— 某个 location 里只要有 add_header，
    # server 层的这几行就全部失效。因此下面每个自带 add_header 的 location 都要完整重复。
    # 站点内部没有任何第三方脚本/字体；唯一的外部来源是 Cloudflare Turnstile（登录人机验证），
    # 因此 script/connect/frame 只额外放行 challenges.cloudflare.com。
    # style 需要 'unsafe-inline'：Vue 的 :style 绑定会生成行内样式。
    # img 需要 data:（内置图形验证码）与 blob:（上传前的本地预览）。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;

    # 只有真正接收上传的接口放宽请求体上限（其余 /api/ 仍是 1m）。
    location ~ ^/api/(?:users/me/(?:avatar|photos)|sugar/profile|friends/profile|stories|vr-maps|virtual-life) {
        client_max_body_size 55m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 私有区媒体（待审/被屏蔽的图片）：由后端校验签名后返回。
    # 同样按「内容一定不是文档」处理，即使有人直接打开地址也不会被当作页面执行。
    location /api/media/ {
        proxy_pass http://backend:8000/api/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        # add_header 不跨层级继承：本 location 一旦自带 add_header，server 层的
        # 其余安全头就会全部失效，因此必须在这里把需要的那几条完整重复一遍。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # 公开区媒体（已过审的图片）。用户上传的文件一律按惰性内容处理：
    # sandbox + nosniff 让 HTML/脚本类 polyglot 文件即便被直接访问也无法执行。
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # 同上：add_header 不继承，必须写全。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;
    }

    # Vite 生成的 assets 文件名带内容哈希，可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;
        try_files $uri =404;
    }
}
