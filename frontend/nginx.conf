server {
    listen 80;
    server_name _;
    # 上传限制：砂糖社最多一次上传 6 张 5 MiB 图片，给 multipart 元数据预留少量空间。
    client_max_body_size 32m;

    # Let's Encrypt HTTP-01 校验目录（certbot 容器通过共享卷写入）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 请求统一跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书路径与 certbot 的 --cert-name yorozuya 对应；entrypoint.sh 监测到证书变化后自动 reload。
    ssl_certificate /etc/letsencrypt/live/yorozuya/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yorozuya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    # 砂糖社最多可一次上传 6 张 5 MiB 图片，给 multipart 元数据预留少量空间。
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite 生成的 assets 文件名带内容哈希，可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
