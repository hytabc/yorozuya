# 默认使用预构建的前端静态文件，避免 Vite 开发服务器在首次访问时实时转换模块。
# 需要源码热重载时叠加 docker-compose.dev.yml，具体命令见 README。

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/wsw.db
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-万事屋管理员}
      STAFF_GROUP_ID: ${STAFF_GROUP_ID:-}
      # 普通用户资料和砂糖社图片共用该持久化目录。
      SUGAR_UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # 看板娘「小白」集中式大脑:值在项目根目录 .env 中设置(compose 只读取根目录 .env)
      MASCOT_API_BASE: ${MASCOT_API_BASE:-}
      MASCOT_API_KEY: ${MASCOT_API_KEY:-}
      MASCOT_MODEL: ${MASCOT_MODEL:-kimi-k2.7-code-highspeed}
      MASCOT_MAX_TOKENS: ${MASCOT_MAX_TOKENS:-1500}
    volumes:
      # 数据库与上传图片持久化：宿主机 backend/data 与容器 /data 一致。
      - ./backend/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Let's Encrypt 证书与 ACME 校验目录（与 certbot 容器共享）
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy

  # 内网穿透（可选）：仅当显式指定 profile 启动
  #   docker compose --profile tunnel up -d --build
  frpc:
    image: snowdreamtech/frpc:0.61.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["-c", "/etc/frp/frpc.toml"]
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN}
      FRP_REMOTE_PORT: ${FRP_REMOTE_PORT:-18080}
      FRP_REMOTE_HTTP_PORT: ${FRP_REMOTE_HTTP_PORT:-80}
      FRP_REMOTE_HTTPS_PORT: ${FRP_REMOTE_HTTPS_PORT:-443}
    volumes:
      - ./deploy/frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frontend

  # Let's Encrypt 证书自动签发与续期（随 tunnel profile 启动，依赖 frp 的 80 端口隧道）
  certbot:
    image: certbot/certbot
    profiles: ["tunnel"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/certbot-entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    depends_on:
      - frontend
      - frpc
