# 生产部署：公网入口是 edge（终止 TLS + HTTP 跳转 HTTPS），frontend 仅在内网提供
# 静态文件与 /api 反向代理，backend 仅在内网提供接口；两者都不发布宿主机端口。
# 首次申请证书见 deploy/init-letsencrypt.sh，续期由 certbot 容器自动完成。
# 需要源码热重载时叠加 docker-compose.dev.yml，具体命令见 README。

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/wsw.db
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-万事屋管理员}
      # 普通用户资料和砂糖社图片共用该持久化目录。
      SUGAR_UPLOAD_DIR: /data/uploads
      # 待审/被屏蔽媒体的私有目录：不在 /uploads 静态托管范围内，只能凭签名地址访问。
      MEDIA_PRIVATE_DIR: ${MEDIA_PRIVATE_DIR:-/data/private_media}
      # 私有媒体签名地址的有效期（秒）；越短则审核驳回后旧链接越快失效。
      MEDIA_TOKEN_TTL_SECONDS: ${MEDIA_TOKEN_TTL_SECONDS:-21600}
      # 站点同源访问，正常不触发 CORS；默认留空，需要跨域时再在 .env 指定。
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 页脚备案信息：留空则前端不展示（真实值只放 .env，不入库）。
      SITE_ICP: ${SITE_ICP:-}
      SITE_ICP_URL: ${SITE_ICP_URL:-https://beian.miit.gov.cn/}
      # ── 邮箱验证与邮件通知（SMTP，示例为阿里云邮件推送）──
      # ⚠️ 真实凭据只写在根目录 .env（已 gitignore），这里仅做透传，仓库里不出现任何密钥。
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtpdm.aliyun.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      # 加密方式：ssl（465，阿里云推荐）/ starttls（80/25，显式加密）/ none。
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-ssl}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # 必须是服务商已验证的发信地址，否则被拒收。
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-万事屋委托站}
      # 邮件链接的可信 HTTPS 来源，生产环境必须明确配置。
      SITE_BASE_URL: ${SITE_BASE_URL:?请在 .env 中设置 HTTPS SITE_BASE_URL}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      EMAIL_SEND_COOLDOWN_SECONDS: ${EMAIL_SEND_COOLDOWN_SECONDS:-60}
      # 未验证闸门：邮件服务出问题时可在 .env 关掉以恢复使用。
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-true}
      # 由 nginx 反向代理访问时按真实客户端 IP 限流。
      BEHIND_PROXY: "true"
      # 看板娘「小白」集中式大脑:值在项目根目录 .env 中设置(compose 只读取根目录 .env)
      MASCOT_API_BASE: ${MASCOT_API_BASE:-}
      MASCOT_API_KEY: ${MASCOT_API_KEY:-}
      MASCOT_MODEL: ${MASCOT_MODEL:-kimi-k2.7-code-highspeed}
      MASCOT_MAX_TOKENS: ${MASCOT_MAX_TOKENS:-1500}
      # 登录/注册人机验证:Site Key 公开;Secret Key 只经服务端环境变量注入。
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x4AAAAAAEwPP7x-AwVA_SVE}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      # 数据库与上传图片持久化：宿主机 backend/data 与容器 /data 一致。
      # 容器以 UID 10001 运行，首次部署需在宿主机执行 chown -R 10001:10001 backend/data。
      - ./backend/data:/data
    # 运行面加固：根文件系统只读，临时目录用内存盘，丢弃全部 Linux capability。
    # 应用只写 /data（bind mount）与 /tmp，不需要任何特权。
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    # 仅供 edge 在内网访问，不映射宿主机端口（开发直连见 docker-compose.dev.yml）。
    expose:
      - "80"
    # 根文件系统只读 + 内存临时目录。nginx 需要 root master 才能 chown/setuid 到
    # worker 用户并绑定 80 端口，因此这里不 cap_drop: ALL，只加 no-new-privileges。
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

  # 公网入口：80 用于 ACME 挑战与跳转，443 终止 TLS。
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/edge-entrypoint.sh"]
    environment:
      # 站点域名只从 .env 读取，不要写进仓库（首次签发证书见 deploy/init-letsencrypt.sh）。
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN（站点域名）}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/edge-entrypoint.sh:/opt/edge-entrypoint.sh:ro
      - ./deploy/nginx/edge.conf.template:/etc/nginx/templates/edge.conf.template:ro
      # 证书缺失时的引导配置（仅放行 ACME 挑战），避免 nginx 因缺少证书而启动失败。
      - ./deploy/nginx/edge-bootstrap.conf.template:/etc/nginx/templates/edge-bootstrap.conf.template:ro
      # 证书目录与 ACME 挑战目录与 certbot 共享。
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # 根文件系统只读：entrypoint 会把渲染后的配置写进 conf.d，因此必须把该目录挂成 tmpfs，
    # 否则 `mv` 会失败导致容器起不来。
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      - frontend

  # 证书自动续期：每 12h 检查一次；续期后的新证书由 edge 定期 reload 加载。
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/renew-loop.sh"]
    volumes:
      - ./deploy/certbot/renew-loop.sh:/opt/renew-loop.sh:ro
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # 续期进程需要写 /etc/letsencrypt（bind mount）与 /var/log/letsencrypt，
    # 因此保持可写，只禁止提权。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
