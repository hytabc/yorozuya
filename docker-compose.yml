services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/wsw.db
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-万事屋管理员}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - wsw_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  frpc:
    image: snowdreamtech/frpc:0.61.1
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["-c", "/etc/frp/frpc.toml"]
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN}
      FRP_REMOTE_PORT: ${FRP_REMOTE_PORT:-18080}
    volumes:
      - ./deploy/frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frontend

volumes:
  wsw_data:

