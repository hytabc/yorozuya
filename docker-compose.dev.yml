# 开发覆盖配置：本地源码变更后，后端自动重载，前端通过 Vite HMR 自动更新页面。
# 启动：docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# 注意：本文件仅供本地开发，暴露 Vite 开发服务器与后端 --reload，且为明文 HTTP，绝不可用于公网。
# 生产入口 edge/certbot 在开发环境没有证书可用，这里用未启用的 profile 把它们排除掉。

services:
  backend:
    environment:
      BEHIND_PROXY: "false"
      SITE_BASE_URL: http://localhost:${WEB_PORT:-8080}
      # 开发环境显式打开 /docs 与 /openapi.json（生产默认关闭，见 config.py 的 ENABLE_DOCS）。
      ENABLE_DOCS: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--reload"]
    volumes:
      - ./backend/app:/app/app
    # 开发环境取消只读根文件系统：--reload 与源码 bind mount 的组合同样需要临时写入，
    # 且本文件已明确不可用于公网，生产加固请以 docker-compose.yml 为准。
    read_only: false

  frontend:
    build:
      context: ./frontend
      target: dev
    # 开发时直接访问 Vite 服务器，因此在这里把宿主机端口映射加回来（生产主文件已移除）。
    ports:
      - "${WEB_PORT:-8080}:80"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_ALLOWED_HOSTS: ${DOMAIN:-}
      # bind mount 在部分宿主机上不会可靠传递文件事件，轮询可保证 HMR 被触发。
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    read_only: false

  edge:
    # 未启用的 profile：开发时不启动（无证书，且会占用宿主机 80/443）。
    profiles: ["production-only"]

  certbot:
    profiles: ["production-only"]
