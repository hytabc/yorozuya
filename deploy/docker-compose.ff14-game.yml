# 与 FF14Push 原 compose 叠加，要求 Docker Compose >= 2.24.4。
services:
  frontend:
    # 清除原 HTTP 宿主机端口，让 edge 接管 19999。
    ports: !reset []
    networks:
      eorzea: {}
      ff14_https:
        aliases:
          - ff14-frontend

networks:
  ff14_https:
    external: true
    name: yorozuya-ff14-https
